[package]
name = "pygrindvakt"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Python bindings for the grindvakt OAuth 2.0 / OpenID Connect / OpenID Federation library"
license = "BSD-2-Clause"
repository = "https://github.com/kushaldas/pygrindvakt"

[lib]
name = "pygrindvakt"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"] }
pythonize = "0.29.0"
# grindvakt 0.7.2 (crates.io). For local co-development against the checkout
# in ../grindvakt, add a `[patch.crates-io]` path override rather than editing
# this pin. jose-rs / kryptering types are reached through `grindvakt::jose_rs`
# so no separate pin (and no version drift) is needed.
grindvakt = { version = "0.7.2", features = ["pkcs11", "redis"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
